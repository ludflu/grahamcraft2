syntax = "proto3";

package game;

service GameService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc SetBlock(SetBlockRequest) returns (SetBlockResponse);
  rpc BreakBlock(BreakBlockRequest) returns (BreakBlockResponse);
  rpc UpdatePosition(UpdatePositionRequest) returns (UpdatePositionResponse);
  rpc SubscribeEvents(SubscribeRequest) returns (stream GameEvent);
}

message JoinRequest {
  string player_name = 1;
}

message JoinResponse {
  string player_id = 1;
  WorldSnapshot world = 2;
  repeated PlayerState players = 3;
}

message WorldSnapshot {
  int32 size_x = 1;
  int32 size_y = 2;
  int32 size_z = 3;
  repeated BlockEntry blocks = 4;
}

message BlockEntry {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  int32 block_type = 4;
}

message PlayerState {
  string player_id = 1;
  string player_name = 2;
  float x = 3;
  float y = 4;
  float z = 5;
}

message SetBlockRequest {
  string player_id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
  int32 block_type = 5;
}

message SetBlockResponse {
  bool success = 1;
}

message BreakBlockRequest {
  string player_id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
}

message BreakBlockResponse {
  bool success = 1;
}

message UpdatePositionRequest {
  string player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message UpdatePositionResponse {
  bool success = 1;
}

message SubscribeRequest {
  string player_id = 1;
}

message GameEvent {
  oneof event {
    BlockChange block_change = 1;
    PlayerMove player_move = 2;
    PlayerJoin player_join = 3;
    PlayerLeave player_leave = 4;
  }
}

message BlockChange {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  int32 block_type = 4;
}

message PlayerMove {
  string player_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message PlayerJoin {
  PlayerState player = 1;
}

message PlayerLeave {
  string player_id = 1;
}
